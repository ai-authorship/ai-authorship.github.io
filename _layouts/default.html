<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <link rel="icon" type="image/png" href="{{ '/assets/ai-authorship-logo.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="wrap header-inner">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="AI Authorship Labels home">
          <img src="{{ '/assets/ai-authorship-logo.png' | relative_url }}" alt="">
          <span class="brand-copy"><strong>AI Authorship</strong><small>Labels for AI text</small></span>
        </a>
        <nav class="site-nav" aria-label="Main navigation">
          <a href="{{ '/' | relative_url }}#labels">Explore labels</a>
          <a href="{{ '/how-to-use.html' | relative_url }}">How to use</a>
          <a href="{{ '/DISCLAIMER.html' | relative_url }}">Disclaimer</a>
          <a class="nav-source" href="{{ site.repository_url }}">GitHub <span aria-hidden="true">↗</span></a>
        </nav>
      </div>
    </header>

    <main id="main" class="wrap page-content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="wrap footer-inner">
        <a class="footer-brand" href="{{ '/' | relative_url }}">AI Authorship Labels</a>
        <p>Optional, self-reported, and not independently verified.</p>
        <div class="footer-links">
          <a href="{{ '/DISCLAIMER.html' | relative_url }}">Disclaimer</a>
          <a href="{{ '/LICENSE' | relative_url }}">CC BY 4.0</a>
          <a href="{{ site.repository_url }}">Contribute ↗</a>
        </div>
      </div>
    </footer>
  </body>
</html>
